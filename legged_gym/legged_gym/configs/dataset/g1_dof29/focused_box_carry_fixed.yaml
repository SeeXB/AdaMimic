defaults:
  - /robot@_global_.robot: g1_dof29
  - /dataset/badminton_hit@_here_
  - _self_

task_id: focused_box_carry_fixed

reference_mode:
  type: full_gmr_sparse
phase_control:
  mode: fixed_reference
  fixed_dt_scale: 1.0
algorithm:
  # Box-Carry stage-1 must start every episode at motion_time=0.  AdaMimic RSI
  # resets the robot into arbitrary semantic phases while the dynamic box reset
  # still places the object on the ground in front of the robot, which creates
  # robot/object state inconsistency.
  rsi: false
dataset:
  folder: /home/aozhou/shixiongbo/GMR/outputs/adamimic_full_reference/focused
  joint_mapping: /home/aozhou/shixiongbo/GMR/outputs/adamimic_full_reference/focused/joint_id.txt
  keyframe_times: []
  keyframe_pos_index: []
  special_scale_index: []

# The values below are explicit task metadata, not inferred from event index.
# They must match the standardized names emitted by the semantic-event
# pipeline; startup fails with the available names if a mapping is wrong.
semantic_keyframes:
  start: start
  approach: approach
  contact: contact
  lift: lift
  carry_mid: carry_mid
  arrive: arrive
  place: place
  release: release

object_interaction:
  enabled: true
  object_type: box
  size: [0.353, 0.344, 0.305]
  mass: 4.0
  friction: 1.0
  restitution: 0.0
  angular_damping: 0.1
  linear_damping: 0.02
  # This specifies reset yaw. Runtime orientation remains physical: locking a
  # dynamic rigid body's pose every step would be a kinematic teleport.
  fixed_orientation: true
  initial_yaw: 0.0

box_carry_task:
  enabled: true
  # Derived from sub3_largebox_003 using the OMOMO object COM projected into
  # the robot initial heading frame.  These are metadata for the fixed demo:
  # delta_box/delta_carry are zero when the sampled command equals these values.
  demo_box_distance: 0.301082
  demo_carry_distance: 2.026532
  demo_lateral_offset: 0.317176
  box_distance_range: [0.301082, 0.301082]
  carry_distance_range: [2.026532, 2.026532]
  offset_axis: robot_forward
  fixed_box_yaw: true
  base_actor_observation_dim: 100
  command_normalization: 1.0
  left_hand_body_name: left_rubber_hand
  right_hand_body_name: right_rubber_hand
  # The rubber-hand mesh extends mostly along +x and is mirrored in local y.
  # The old [0.055, 0, 0] point is near the palm/inertial center, not a contact
  # surface, and can sit inside the box even when the palm surface is outside.
  left_hand_contact_offset: [0.0, -0.055, 0.0]
  right_hand_contact_offset: [0.0, -0.055, 0.0]
  hand_contact_side_signs: [-1.0, -1.0]
  contact_surface_margin: 0.035
  min_surface_clearance: 0.015
  contact_patch_margin: 0.04
  # Data-driven from validate_box_reference_geometry.py after the object COM
  # and contact-side fixes: focused reference contact/lift/carry needs 0.399m.
  contact_distance_threshold: 0.40
  contact_penetration_tolerance: 0.02
  # sub3_largebox_003 is a same-side/support-style carry reference after
  # projection into the box frame. Requiring opposite faces makes the contact
  # state impossible while the dense/local imitation still asks for this demo.
  require_opposite_contact_sides: false
  contact_velocity_tolerance: 0.75
  contact_hold_steps: 3
  contact_grace_steps: 3
  lift_threshold: 0.08
  max_tilt: 0.65
  lift_hold_steps: 3
  minimum_transport_height: 0.08
  max_transport_tilt: 0.65
  goal_position_threshold: 0.12
  arrive_hold_steps: 3
  place_height_threshold: 0.035
  place_tilt_threshold: 0.65
  place_linear_velocity_threshold: 0.20
  place_angular_velocity_threshold: 1.0
  place_hold_steps: 8
  release_distance_threshold: 0.16
  release_hold_steps: 8
  drop_height_threshold: 0.05
  drop_hold_steps: 15
  max_box_robot_distance: 3.0
  max_progress_per_step: 0.05
  approach_sigma: 0.15
  place_position_sigma: 0.12
  place_height_sigma: 0.04
  place_velocity_sigma: 0.35

box_carry_observation:
  # Existing actor prefix 100 + 9 task/object values; five history steps.
  num_one_step_observations: 109
  num_observations: 545
  # G1 has odometry enabled: its existing privileged state is 136-D
  # (includes lidar position and IMU quaternion), plus nine box/task values.
  num_privileged_obs: 145
  num_privileged_obs_high: 145

rewards:
  scales:
    # Existing sparse tracking and dense local tracking scales are inherited
    # unmodified from focused_full_gmr_sparse.yaml.
    dense_box_hand_approach: 0.5
    dense_box_hand_penetration: -3.0
    dense_box_contact_proxy: 1.0
    dense_box_lift: 2.0
    dense_box_transport: 5.0
    dense_box_place: 2.0
    dense_box_release: 2.0
    dense_tracking_human_local_position: 0.0
    dense_tracking_human_joint_angle: 0.0
    dense_tracking_human_root_velocity: 0.0
    dense_tracking_human_heading: 0.0
    dense_tracking_human_feet_velocity: 0.0
